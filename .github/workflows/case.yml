name: run-case
run-name: case ${{ inputs.date }} | ${{ inputs.leads }}${{ inputs.cam_runs != '' && ' | latest CAMs' || '' }}${{ inputs.ec_cin == '0' && ' | no EC CIN' || '' }}
# Whole pipeline for one convective day in the cloud: SPC files, model fields (decoded-field cache in
# Cloudflare R2 first, then raw downloads for whatever is missing, main fields and CI extras in
# parallel), scoring, verification and the CI layer. New decoded fields go back to R2 so reruns skip
# the download. Only the case folder (~50 MB) is uploaded as the artifact; remote_case.py fetches it.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Convective day (YYYY-MM-DD)"
        required: true
      leads:
        description: "SPC lead days, space separated"
        default: "8 7 6 5 4 3 2 1"
      cam_runs:
        description: "Optional Day 1 CAM run override, e.g. hrrr:2026102919,2026102920;rap:2026102923"
        default: ""
      ec_cin:
        description: "1 = ECMWF gets CIN / surface-based share from derive_parcel.py; 0 = score without (backtests)"
        default: "1"

jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      POGS_CACHE: /tmp/pogs_cache
      POGS_CASES: ${{ github.workspace }}/cases
      MAIN_MODELS: gfs gefs hres eps hrrr nam rap nam12 rrfs eps_z
      X_MODELS: gfs_x gefs_x hres_x eps_x hrrr_ci nam_ci rap_ci nam12_ci nam12_x rrfs_ci
      # upper air: its own pass after main/x (memory: the 4-core runner was killed running all three at once, 30 Oct)
      UA_MODELS: gfs_snd hres_snd gefs_pl eps_pl
      # add-on sets adopted 31 Oct 2026 (config.ADD_FIELDS); EPS add-on is the heavy one, so it gets its own pass
      ADD_MODELS: gfs_add gefs_add hres_add hrrr_add nam_add rap_add nam12_add hrrr_sfc
      EPS_ADD: eps_add
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: hhwx-model-cache
      POGS_CAM_RUNS: ${{ inputs.cam_runs }}
      POGS_EC_CIN: ${{ inputs.ec_cin }}
      PCL_MODELS: hres_pcl eps_pcl
    defaults:
      run:
        shell: bash  # -eo pipefail, so a failing script fails its step even through `| tee`
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt scipy pandas shapely boto3
      - name: Runner size
        run: echo "cores=$(nproc)"; free -g; df -h /tmp | tail -1
      - name: SPC outlooks, discussions and reports
        run: python -u fetch_spc.py "${{ inputs.date }}"
      - name: Pull decoded fields from R2
        run: python -u r2_cache.py pull "${{ inputs.date }}" --leads ${{ inputs.leads }} --models $MAIN_MODELS $X_MODELS $UA_MODELS $ADD_MODELS $EPS_ADD $PCL_MODELS
      - name: Model downloads for anything not in R2 (main fields and CI extras in parallel)
        run: |
          mkdir -p "cases/${{ inputs.date }}/logs"
          python -u download_case.py "${{ inputs.date }}" --leads ${{ inputs.leads }} --models $MAIN_MODELS \
            --ncep-workers 48 --ec-workers 16 --decode-procs 3 > "cases/${{ inputs.date }}/logs/download_main.log" 2>&1 &
          p1=$!
          python -u download_case.py "${{ inputs.date }}" --leads ${{ inputs.leads }} --models $X_MODELS \
            --ncep-workers 32 --ec-workers 12 --decode-procs 2 > "cases/${{ inputs.date }}/logs/download_x.log" 2>&1 &
          p2=$!
          wait $p1; s1=$?; wait $p2; s2=$?
          tail -n 3 "cases/${{ inputs.date }}/logs/download_main.log" "cases/${{ inputs.date }}/logs/download_x.log"
          exit $(( s1 || s2 ))
      - name: Push new decoded fields to R2
        run: python -u r2_cache.py push "${{ inputs.date }}" --leads ${{ inputs.leads }} --models $MAIN_MODELS $X_MODELS
      - name: Add-on downloads (adopted parameter review; scoring does not need them yet)
        continue-on-error: true
        run: |
          python -u download_case.py "${{ inputs.date }}" --leads ${{ inputs.leads }} --models $ADD_MODELS             --ncep-workers 24 --ec-workers 8 --decode-procs 2 > "cases/${{ inputs.date }}/logs/download_add.log" 2>&1
          s=$?; tail -n 3 "cases/${{ inputs.date }}/logs/download_add.log"; exit $s
      - name: Push add-on fields to R2
        if: always()
        run: python -u r2_cache.py push "${{ inputs.date }}" --leads ${{ inputs.leads }} --models $ADD_MODELS || true
      - name: Upper-air downloads (separate, lighter pass; scoring does not need them)
        continue-on-error: true
        run: |
          python -u download_case.py "${{ inputs.date }}" --leads ${{ inputs.leads }} --models $UA_MODELS             --ncep-workers 16 --ec-workers 8 --decode-procs 2 > "cases/${{ inputs.date }}/logs/download_ua.log" 2>&1
          s=$?; tail -n 3 "cases/${{ inputs.date }}/logs/download_ua.log"; exit $s
      - name: Push upper-air fields to R2
        if: always()
        run: python -u r2_cache.py push "${{ inputs.date }}" --leads ${{ inputs.leads }} --models $UA_MODELS || true
      - name: EPS add-on downloads (50 members; own pass)
        continue-on-error: true
        run: |
          python -u download_case.py "${{ inputs.date }}" --leads ${{ inputs.leads }} --models $EPS_ADD             --ncep-workers 8 --ec-workers 8 --decode-procs 2 > "cases/${{ inputs.date }}/logs/download_eps_add.log" 2>&1
          s=$?; tail -n 3 "cases/${{ inputs.date }}/logs/download_eps_add.log"; exit $s
      - name: Push EPS add-on fields to R2
        if: always()
        run: python -u r2_cache.py push "${{ inputs.date }}" --leads ${{ inputs.leads }} --models $EPS_ADD || true
      - name: ECMWF CIN and surface-based share from the upper-air sets (derive_parcel.py)
        continue-on-error: true
        run: python -u derive_parcel.py "${{ inputs.date }}" --leads ${{ inputs.leads }} --procs 4 2>&1 | tee "cases/${{ inputs.date }}/logs/derive_parcel.log"
      - name: Push ECMWF parcel fields to R2
        if: always()
        run: python -u r2_cache.py push "${{ inputs.date }}" --leads ${{ inputs.leads }} --models $PCL_MODELS || true
      - name: Score
        run: python -u run_case.py "${{ inputs.date }}" --leads ${{ inputs.leads }} --no-plots 2>&1 | tee "cases/${{ inputs.date }}/logs/run_case.log"
      - name: Verify (skipped for real-time cases without reports)
        run: python -u verify_case.py "${{ inputs.date }}" 2>&1 | tee "cases/${{ inputs.date }}/logs/verify.log" || true
      - name: CI layer
        run: |
          python -u ci.py "${{ inputs.date }}" --leads ${{ inputs.leads }} 2>&1 | tee "cases/${{ inputs.date }}/logs/ci.log"
          python -u ci.py "${{ inputs.date }}" --leads ${{ inputs.leads }} --env v3 --out ci_layers_v3.npz 2>&1 | tee "cases/${{ inputs.date }}/logs/ci_v3.log"
      - name: Upper-air diagnostics (member means per model, cycle and valid time)
        run: python -u diag_upper.py "${{ inputs.date }}" --leads ${{ inputs.leads }} 2>&1 | tee "cases/${{ inputs.date }}/logs/diag_upper.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-${{ inputs.date }}
          path: cases/${{ inputs.date }}
          retention-days: 3
