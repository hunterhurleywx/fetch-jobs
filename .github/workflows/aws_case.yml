name: aws-case
run-name: case ${{ inputs.date }} | ${{ inputs.leads }}${{ inputs.cam_runs != '' && ' | latest CAMs' || '' }}${{ inputs.pool_end != '' && format(' | pool to {0}', inputs.pool_end) || '' }}${{ inputs.ec_cin == '0' && ' | no EC CIN' || '' }}${{ inputs.addons == '0' && ' | no add-ons' || '' }} | aws
# The run-case pipeline on one big AWS spot machine (us-east-1, next to NOAA's data) instead of the 4-core runner.
# This job only launches and watches: it signs in to AWS through GitHub's OIDC token (role hhwx-github-launcher,
# no stored AWS keys), hands the machine its job through the private hhwx-cases bucket, waits, then publishes
# the case folder as the same "case-<date>" artifact case.yml makes, so remote_case.py collects it unchanged.
# The machine (aws/user_data.sh -> aws/pipeline.sh) powers itself off; the last step here terminates it regardless.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Convective day (YYYY-MM-DD)"
        required: true
      leads:
        description: "SPC lead days, space separated"
        default: "8 7 6 5 4 3 2 1"
      cam_runs:
        description: "Optional CAM run override, e.g. nam12:2026103100,2026103106;rrfs:2026103100"
        default: ""
      ec_cin:
        description: "1 = ECMWF CIN from derive_parcel.py; 0 = without (backtests)"
        default: "1"
      addons:
        description: "1 = also the checklist add-on sets; 0 = scoring-only run"
        default: "1"
      types:
        description: "Spot instance types to try in order (32 vCPU while the quota is 32; 16xlarge once 64+ is approved)"
        default: "c7i.8xlarge c7a.8xlarge c6i.8xlarge m7i.8xlarge c6a.8xlarge m6i.8xlarge m7a.8xlarge r7i.8xlarge"
      attempts:
        description: "Market per attempt; a lost machine relaunches the next attempt, which resumes from the R2 cache. Hunter, 31 Oct: backfills = spot first (cheaper), real-time = ondemand ondemand (remote_case.py --realtime)"
        default: "spot spot ondemand"
      pool_end:
        description: "Real-time: end every lead's global pool at this cycle (YYYYMMDDHH), e.g. today's 12Z"
        default: ""
      skip:
        description: "Runs to leave out as if missing (freeze a real-time case), e.g. hres:2026103112,eps:2026103112"
        default: ""
      dry_run:
        description: "1 = only check the AWS sign-in and launch permissions (run-instances --dry-run); nothing starts"
        default: "0"

permissions:
  id-token: write
  contents: read

jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_REGION: us-east-1
      B: hhwx-cases
      RUN: runs/${{ inputs.date }}-${{ github.run_id }}
      OD_TYPES: c7i.4xlarge c7a.4xlarge c6i.4xlarge m7i.4xlarge  # on-demand quota is 16 vCPU (an input slot went to skip; GitHub allows 10)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::420259808285:role/hhwx-github-launcher
          aws-region: us-east-1
          role-duration-seconds: 7200
      - name: Hand the machine its job (private bucket; deleted at the end of this job)
        if: inputs.dry_run != '1'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          umask 077
          {
            printf 'DATE=%q\nLEADS=%q\nCAM_RUNS=%q\nEC_CIN=%q\nADDONS=%q\nSHA=%q\nPOGS_POOL_END=%q\nPOGS_SKIP=%q\n' \
              "${{ inputs.date }}" "${{ inputs.leads }}" "${{ inputs.cam_runs }}" "${{ inputs.ec_cin }}" "${{ inputs.addons }}" "$GITHUB_SHA" "${{ inputs.pool_end }}" "${{ inputs.skip }}"
            printf 'R2_ACCESS_KEY_ID=%q\nR2_SECRET_ACCESS_KEY=%q\nR2_ENDPOINT=%q\n' "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" "$R2_ENDPOINT"
          } > job.env
          aws s3 cp job.env "s3://$B/$RUN/job.env" --only-show-errors
          rm -f job.env
      - name: Run on AWS (launch, watch the log, relaunch after a spot loss)
        id: run
        run: |
          AMI=$(aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 --query Parameter.Value --output text)
          SUBNETS=$(aws ec2 describe-subnets --filters Name=default-for-az,Values=true --query 'Subnets[].SubnetId' --output text)
          TAGS="Key=project,Value=hhwx},{Key=Name,Value=hhwx-case-${{ inputs.date }}"
          launch() {  # launch <attempt> <spot|ondemand> [--dry-run]: first type / zone with capacity; sets ID
            local att=$1 mkt=$2 dry=${3:-} types MKT="" SPOTTAG=""
            sed -e "s#__RUN__#$RUN#" -e "s#__ATT__#$att#" aws/user_data.sh > ud.sh
            if [ "$mkt" = spot ]; then
              types="${{ inputs.types }}"
              MKT='--instance-market-options MarketType=spot,SpotOptions={SpotInstanceType=one-time,InstanceInterruptionBehavior=terminate}'
              SPOTTAG="ResourceType=spot-instances-request,Tags=[{$TAGS}]"
            else
              types="$OD_TYPES"
            fi
            ID=""
            for T in $types; do
              for S in $SUBNETS; do
                ID=$(aws ec2 run-instances $dry --image-id "$AMI" --instance-type "$T" --subnet-id "$S" $MKT \
                  --iam-instance-profile Name=hhwx-instance-role \
                  --instance-initiated-shutdown-behavior terminate \
                  --metadata-options HttpTokens=required \
                  --block-device-mappings 'DeviceName=/dev/xvda,Ebs={VolumeSize=120,VolumeType=gp3,Iops=6000,Throughput=500,DeleteOnTermination=true}' \
                  --user-data file://ud.sh \
                  --tag-specifications "ResourceType=instance,Tags=[{$TAGS}]" "ResourceType=volume,Tags=[{$TAGS}]" \
                    "ResourceType=network-interface,Tags=[{$TAGS}]" $SPOTTAG \
                  --query 'Instances[0].InstanceId' --output text 2> err.txt) && { echo "attempt $att: launched $ID ($T, $mkt) at $(date -u +%H:%M:%SZ)"; echo "$ID" >> ids.txt; return 0; }
                if [ -n "$dry" ]; then
                  grep -q DryRunOperation err.txt && { echo "DRY RUN OK: sign-in, tags, PassRole and launch permissions accepted ($T, $mkt)"; return 0; }
                  echo "dry run refused: $(tail -c 300 err.txt)"; return 1
                fi
                echo "  $T in $S: $(tail -c 200 err.txt)"
              done
            done
            return 1
          }
          watch() {  # watch <attempt>: 0 = DONE, 1 = FAILED, 2 = machine lost (spot reclaimed / time limit)
            local att=$1 seen=0 st state n
            while true; do
              sleep 60
              if aws s3 cp "s3://$B/$RUN/a$att/log.txt" log.txt --only-show-errors 2>/dev/null; then
                n=$(wc -l < log.txt); if [ "$n" -gt "$seen" ]; then sed -n "$((seen + 1)),${n}p" log.txt | grep -v '^+' || true; fi; seen=$n
              fi
              st=$(aws s3 cp "s3://$B/$RUN/a$att/status" - 2>/dev/null || true)
              if [ -n "$st" ]; then echo "attempt $att status: $st"; [ "$st" = DONE ] && return 0 || return 1; fi
              state=$(aws ec2 describe-instances --instance-ids "$ID" --query 'Reservations[0].Instances[0].State.Name' --output text)
              if [ "$state" = terminated ] || [ "$state" = shutting-down ]; then
                sleep 20; st=$(aws s3 cp "s3://$B/$RUN/a$att/status" - 2>/dev/null || true)
                if [ -n "$st" ]; then echo "attempt $att status: $st"; [ "$st" = DONE ] && return 0 || return 1; fi
                echo "attempt $att: machine gone without a status: $(aws ec2 describe-instances --instance-ids "$ID" --query 'Reservations[0].Instances[0].StateReason.Message' --output text)"
                return 2
              fi
            done
          }
          if [ "${{ inputs.dry_run }}" = 1 ]; then
            aws sts get-caller-identity --query Arn --output text
            launch 0 spot --dry-run && launch 0 ondemand --dry-run; exit $?
          fi
          att=0
          for mkt in ${{ inputs.attempts }}; do
            att=$((att + 1))
            launch $att $mkt || { echo "attempt $att: no $mkt capacity / launch refused"; continue; }
            rc=0; watch $att || rc=$?
            if [ $rc -eq 0 ] || [ $rc -eq 1 ]; then echo "att=$att" >> "$GITHUB_OUTPUT"; exit $rc; fi
          done
          echo "every attempt was lost or refused"; exit 1
      - name: Fetch the case folder and the machine logs
        if: always() && inputs.dry_run != '1'
        run: |
          mkdir -p "cases/${{ inputs.date }}/logs"
          A="${{ steps.run.outputs.att }}"
          if [ -n "$A" ]; then aws s3 cp "s3://$B/$RUN/a$A/case.tar.gz" case.tar.gz --only-show-errors && tar -xzf case.tar.gz -C cases || true; fi
          for d in $(aws s3 ls "s3://$B/$RUN/" | awk '/PRE a/{print $2}'); do
            aws s3 cp "s3://$B/$RUN/${d}log.txt" "cases/${{ inputs.date }}/logs/machine_${d%/}.log" --only-show-errors || true
          done
          ls "cases/${{ inputs.date }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-${{ inputs.date }}
          path: cases/${{ inputs.date }}
          retention-days: 3
      - name: Terminate the machine(s) and clear the run's files
        if: always()
        run: |
          if [ -s ids.txt ]; then aws ec2 terminate-instances --instance-ids $(cat ids.txt) --query 'TerminatingInstances[].[InstanceId,CurrentState.Name]' --output text || true; fi
          aws s3 rm "s3://$B/$RUN/" --recursive --only-show-errors || true
